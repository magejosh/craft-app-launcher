[package]
name = "craft-app-launcher"
version = "0.2.0"
edition = "2021"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "sync", "time", "io-util", "io-std"] }
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }

[[bin]]
name = "craft-launcher-agent"
path = "src/agent_main.rs"